name: CI
on:
  pull_request:
    types: [opened, reopened, synchronize, edited, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  scope:
    uses: ./.github/workflows/ci-scope.yml
    with:
      profile: meta
  format-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - run: node --test scripts/pr-format.test.mjs
  verify:
    needs: [scope, format-tests]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Verify organization changes
        env:
          RESULT: ${{ needs.scope.result }}
          FORMAT_RESULT: ${{ needs.format-tests.result }}
        run: test "$RESULT" = success && test "$FORMAT_RESULT" = success
