name: Change-aware CI scope
on:
  workflow_call:
    inputs:
      profile:
        type: string
        required: true
    outputs:
      runtime:
        value: ${{ jobs.scope.outputs.runtime }}
      core:
        value: ${{ jobs.scope.outputs.core }}
      site:
        value: ${{ jobs.scope.outputs.site }}
      editor:
        value: ${{ jobs.scope.outputs.editor }}
      web:
        value: ${{ jobs.scope.outputs.web }}
      game:
        value: ${{ jobs.scope.outputs.game }}
      react18:
        value: ${{ jobs.scope.outputs.react18 }}
      workflow:
        value: ${{ jobs.scope.outputs.workflow }}
permissions:
  contents: read
  issues: read
  pull-requests: read
jobs:
  scope:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      runtime: ${{ steps.scope.outputs.runtime }}
      core: ${{ steps.scope.outputs.core }}
      site: ${{ steps.scope.outputs.site }}
      editor: ${{ steps.scope.outputs.editor }}
      web: ${{ steps.scope.outputs.web }}
      game: ${{ steps.scope.outputs.game }}
      react18: ${{ steps.scope.outputs.react18 }}
      workflow: ${{ steps.scope.outputs.workflow }}
    steps:
      - name: Validate contribution metadata
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd
        with:
          script: |
            const pr = (await github.rest.pulls.get({ ...context.repo, pull_number: context.payload.pull_request.number })).data;
            if (pr.head.sha !== context.payload.pull_request.head.sha) {
              core.setFailed('PR head changed; wait for the current revision check.');
              return;
            }
            const errors = [];
            const titlePattern = /^(?:feat|feature|fix|bug|docs|refactor|test|chore|ci|build|perf|improvement|style|revert|release|design|deps)(?:\([a-z0-9][a-z0-9/-]*\))?!?: \S.+$/u;
            if (!titlePattern.test(pr.title)) errors.push('Use a type-prefixed title, e.g. fix: clarify focus behavior.');
            const expected = ['Related issue', 'Summary', 'Verification', 'Product and design impact', 'Permissions and data'];
            const readSections = (body, expected, issue = false) => {
              const sections = new Map();
              const order = [];
              const lines = (body || '').replace(/<!--[\s\S]*?(?:-->|$)/g, '').split(/\r?\n/);
              let section = null;
              let fence = null;
              for (const line of lines) {
                const marker = /^\s{0,3}(\x60{3,}|~{3,})/.exec(line);
                if (marker) {
                  if (!fence) fence = marker[1];
                  else if (marker[1][0] === fence[0] && marker[1].length >= fence.length && new RegExp('^\\s{0,3}' + fence[0] + '{' + fence.length + ',}\\s*$').test(line)) fence = null;
                  continue;
                }
                if (fence) continue;
                const heading = (issue ? /^#{2,3} ([^#]+?)\s*$/ : /^## ([^#]+?)\s*$/).exec(line);
                if (heading) {
                  section = heading[1].trim();
                  if (expected.includes(section)) order.push(section);
                  if (!sections.has(section)) sections.set(section, []);
                  continue;
                }
                if (section !== null) sections.get(section).push(line);
              }
              return { sections, order };
            };
            const { sections, order } = readSections(pr.body, expected);
            if (order.join('|') !== expected.join('|')) errors.push('Use each required ## heading once, in template order: ' + expected.join(', ') + '.');
            const prompts = new Set([
              'what changed and why?',
              'list the actual commands or checks run and their results. note checks not run and why.',
              'which \x60agents.md\x60 and project-specific guidance did you follow?',
              'describe user-facing behavior, screenshots or gameplay captures, localization, accessibility, and project-specific ui/design-rule impact. write “none” when not applicable.',
              'describe any change to permissions, captured fields, deployment, releases, or secrets. use synthetic values in examples.'
            ]);
            const normalize = line => line.trim().replace(/^[-*+]\s+(?:\[[ xX]\]\s*)?/, '').replace(/^\d+\.\s+/, '').trim().toLowerCase();
            for (const heading of expected.slice(1)) {
              const nullable = heading === 'Product and design impact' || heading === 'Permissions and data';
              const filled = (sections.get(heading) || []).some(line => {
                const value = normalize(line);
                if (!/[\p{L}\p{N}]/u.test(value) || prompts.has(value) || /^(?:tbd|todo|placeholder|fill me in)[.!]?$/i.test(value)) return false;
                if (!nullable && /^(?:none|n\/a|not applicable|tested|pass(?:ed)?|no changes)[.!]?$/i.test(value)) return false;
                return true;
              });
              if (!filled) errors.push('Fill in the ' + heading + ' section; remove placeholders.');
            }
            const releasePR = pr.head.repo?.id === pr.base.repo.id && pr.head.ref === 'develop' && pr.base.ref === pr.base.repo.default_branch;
            const syncPR = pr.head.repo?.id === pr.base.repo.id && pr.head.ref === pr.base.repo.default_branch && pr.base.ref === 'develop';
            const references = [];
            const referencePattern = /^(?:[-*+]\s+)?(Refs|Closes)\s+((?:[a-z0-9_.-]+\/[a-z0-9_.-]+)?#([1-9]\d*))\.?$/i;
            for (const line of sections.get('Related issue') || []) {
              const match = referencePattern.exec(line.trim());
              if (!match) continue;
              const issueNumber = Number(match[3]);
              if (!Number.isSafeInteger(issueNumber)) continue;
              const target = match[2].split('#')[0] || context.repo.owner + '/' + context.repo.repo;
              references.push({ verb: match[1].toLowerCase(), repository: target.toLowerCase(), number: issueNumber });
            }
            if (!references.length) errors.push('Add a valid issue reference in Related issue, e.g. Refs #123 or Closes owner/repo#123.');
            if (!releasePR && references.length > 1) errors.push('Use exactly one scoped issue reference for a topic or synchronization PR; only develop-to-default release PRs may list several.');
            if (new Set(references.map(ref => ref.repository + '#' + ref.number)).size !== references.length) errors.push('List each linked issue once.');
            if (pr.base.ref !== pr.base.repo.default_branch && references.some(ref => ref.verb === 'closes')) errors.push('Use Refs for an integration branch; use Closes only for completed work on the default branch.');
            const local = (context.repo.owner + '/' + context.repo.repo).toLowerCase();
            const issueFormatSince = Date.parse('2026-11-24T08:31:35Z');
            const issueFields = {
              'type: bug': ['Expected behavior', 'Observed behavior', 'Reproduction steps', 'Environment'],
              'type: chore': ['Context', 'Proposed maintenance', 'Impact and risks', 'Acceptance criteria'],
              'type: documentation': ['Documentation affected', 'Current gap', 'Proposed changes', 'Acceptance criteria'],
              'type: feature': ['Problem or opportunity', 'Proposed feature', 'Use cases', 'Scope and non-goals', 'Acceptance criteria'],
              'type: fix': ['Problem', 'Scope', 'Expected behavior', 'Acceptance criteria'],
              'type: improvement': ['Current behavior', 'Proposed improvement', 'Expected benefits', 'Acceptance criteria'],
              'type: refactor': ['Current implementation', 'Motivation', 'Proposed approach', 'Compatibility constraints', 'Acceptance criteria'],
              'type: test': ['Behavior to verify', 'Test gap', 'Proposed scenarios', 'Acceptance criteria']
            };
            const validateIssue = issue => {
              if (Date.parse(issue.created_at) < issueFormatSince || !issue.created_at) return;
              const types = (issue.labels || []).map(label => typeof label === 'string' ? label : label.name)
                .filter(label => Object.hasOwn(issueFields, label));
              if (types.length !== 1) {
                errors.push('A newly created local issue needs exactly one supported issue-form type label.');
                return;
              }
              const fields = issueFields[types[0]];
              const parsed = readSections(issue.body, fields, true);
              for (const field of fields) {
                const filled = (parsed.sections.get(field) || []).some(line => {
                  const value = normalize(line);
                  return /[\p{L}\p{N}]/u.test(value) && !/^(?:tbd|todo|placeholder|fill me in|_no response_)[.!]?$/i.test(value) &&
                    (!/^(?:none|n\/a|not applicable)[.!]?$/i.test(value) || ['Impact and risks', 'Compatibility constraints', 'Scope and non-goals'].includes(field));
                });
                if (!filled) errors.push('A newly created local issue must fill its ' + field + ' field.');
                if (field === 'Acceptance criteria' && filled) {
                  const criteria = (parsed.sections.get(field) || []).filter(line => line.trim());
                  if (!criteria.length || criteria.some(line => !/^\s*[-*+]\s+(?:\[[ xX]\]\s+)?\S/.test(line) || !/[\p{L}\p{N}]/u.test(normalize(line)) || /^(?:tbd|todo|placeholder|fill me in|none|n\/a|not applicable)[.!]?$/i.test(normalize(line)))) errors.push('Write measurable acceptance criteria as Markdown bullets or checkboxes.');
                }
              }
            };
            for (const number of new Set(references.filter(ref => ref.repository === local).map(ref => ref.number))) {
              try {
                const issue = (await github.rest.issues.get({ ...context.repo, issue_number: number })).data;
                if (issue.pull_request) errors.push('A local reference targets a pull request, not an issue.');
                else validateIssue(issue);
              } catch {
                errors.push('A local issue reference could not be verified. Check the issue number and read permission.');
              }
            }
            const maintainerTopic = pr.head.repo?.id === pr.base.repo.id &&
              ['OWNER', 'MEMBER', 'COLLABORATOR'].includes(pr.author_association) &&
              !releasePR && !syncPR;
            if (maintainerTopic) {
              const commits = await github.paginate(github.rest.pulls.listCommits, { ...context.repo, pull_number: pr.number, per_page: 100 });
              if (commits.length !== pr.commits) errors.push('Could not verify every commit subject; split or inspect the topic branch.');
              for (const [index, commit] of commits.entries()) {
                if (commit.parents.length > 1) continue;
                const subject = commit.commit.message.split(/\r?\n/)[0];
                if (!titlePattern.test(subject) && !/^Revert ".+"$/u.test(subject)) errors.push('Commit ' + (index + 1) + ' needs a type-prefixed subject.');
              }
            }
            if (errors.length) core.warning(errors.join('\n'));
            else core.info('Contribution metadata meets the structural checks. Verification evidence still requires review.');
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify changed paths
        id: scope
        env:
          PROFILE: ${{ inputs.profile }}
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process');
          const fs = require('node:fs');
          const profile = process.env.PROFILE;
          const allowed = ['meta', 'planning', 'extension', 'ui', 'vertactics', 'game', 'kowrap', 'skills', 'agents'];
          if (!allowed.includes(profile)) throw Error('Unknown CI profile');
          const git = (...args) => execFileSync('git', args, { encoding: 'utf8' });
          let base = '';
          if (process.env.EVENT === 'pull_request') base = git('rev-parse', 'HEAD^1').trim();
          else if (process.env.EVENT === 'push' && /^[a-f0-9]{40}$/i.test(process.env.BEFORE || '') && !/^0+$/.test(process.env.BEFORE)) {
            try { git('cat-file', '-e', process.env.BEFORE + '^{commit}'); base = process.env.BEFORE; } catch {}
          }
          if (base) git('diff', '--check', base, 'HEAD');
          const paths = base ? git('diff', '--no-renames', '--name-only', '-z', base, 'HEAD').split('\0').filter(Boolean) : [];
          const metadata = p => /^(?:\.github\/(?:CODEOWNERS|ISSUE_TEMPLATE\/|pull_request_template\.md|PULL_REQUEST_TEMPLATE\.md|workflows\/oddmash-(?:pr-labels|review-relay)\.yml)|\.agents\/skills\/.*\.md$)/i.test(p);
          const doc = p => (!p.includes('/') && /\.md$/i.test(p)) || p.startsWith('docs/') || (profile === 'vertactics' && p.startsWith('skills/'));
          const product = paths.filter(p => !metadata(p) && (!doc(p) || (profile === 'kowrap' && p.startsWith('docs/guide/'))));
          const full = !base || paths.some(p => /^\.github\/workflows\/ci\.yml$/.test(p));
          const runtime = !['meta', 'planning'].includes(profile) && (full || product.length > 0);
          const only = prefix => product.length > 0 && product.every(p => p.startsWith(prefix));
          const core = runtime && (profile !== 'kowrap' || full || product.some(p => !p.startsWith('site/') && !p.startsWith('docs/guide/') && p !== 'test/site.mjs'));
          const deploymentPath = p => !p.startsWith('.github/') && !p.startsWith('scripts/audit-') && !p.startsWith('scripts/check-') && !p.startsWith('scripts/inspect-') && !/(?:^|\/)(?:tests?|playwright[^/]*)(?:\/|$|\.)/.test(p);
          const site = runtime && (profile === 'kowrap' || profile === 'ui' || (profile === 'vertactics' && (!base || product.some(deploymentPath))));
          const editor = runtime && (profile !== 'vertactics' || full || !only('apps/landing/'));
          const web = runtime && (profile !== 'game' || full || !only('apps/game/'));
          const game = runtime && (profile !== 'game' || full || product.some(p => !p.startsWith('apps/client/') && p !== 'index.html' && !p.startsWith('public/')));
          const react18 = runtime && (profile !== 'ui' || full || !only('demo/'));
          const workflow = !base || paths.some(p => p.startsWith('.github/workflows/') || p.startsWith('.github/actions/'));
          for (const [key, value] of Object.entries({ runtime, core, site, editor, web, game, react18, workflow })) fs.appendFileSync(process.env.GITHUB_OUTPUT, key + '=' + value + '\n');
          console.log(JSON.stringify({ profile, changed: paths.length, runtime, core, site, editor, web, game, react18, workflow }));
          NODE
      - name: Validate workflow syntax
        if: steps.scope.outputs.workflow == 'true'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 -shellcheck= -pyflakes=
