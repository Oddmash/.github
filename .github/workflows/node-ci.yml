name: Reusable Node CI

on:
  workflow_call:
    inputs:
      node-version:
        description: Node.js version used by the repository
        required: false
        type: string
        default: '24'
      working-directory:
        description: Directory containing package.json and pnpm-lock.yaml
        required: false
        type: string
        default: '.'
      ignore-install-scripts:
        description: Install dependencies without running package lifecycle scripts
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    name: Node quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa
        with:
          package_json_file: ${{ inputs.working-directory }}/package.json
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml
      - name: Install dependencies
        if: ${{ !inputs.ignore-install-scripts }}
        run: pnpm install --frozen-lockfile
      - name: Install dependencies without lifecycle scripts
        if: ${{ inputs.ignore-install-scripts }}
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Run repository CI contract
        run: pnpm run ci
