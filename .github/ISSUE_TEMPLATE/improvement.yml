name: "Improvement"
description: "Improve an existing capability or experience"
labels: ["type: improvement"]
body:
  - type: textarea
    id: current-behavior
    attributes:
      label: "Current behavior"
      description: "Describe the existing behavior."
    validations:
      required: true
  - type: textarea
    id: proposed-improvement
    attributes:
      label: "Proposed improvement"
      description: "Describe the new behavior."
    validations:
      required: true
  - type: textarea
    id: expected-benefits
    attributes:
      label: "Expected benefits"
      description: "Explain what improves and why."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance criteria"
      description: "List measurable completion criteria."
    validations:
      required: true
