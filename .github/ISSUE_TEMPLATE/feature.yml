name: "Feature"
description: "Propose a new capability"
labels: ["type: feature"]
body:
  - type: textarea
    id: problem-or-opportunity
    attributes:
      label: "Problem or opportunity"
      description: "Explain the problem or opportunity."
    validations:
      required: true
  - type: textarea
    id: proposed-feature
    attributes:
      label: "Proposed feature"
      description: "Describe the intended behavior."
    validations:
      required: true
  - type: textarea
    id: use-cases
    attributes:
      label: "Use cases"
      description: "Describe who benefits and how."
    validations:
      required: true
  - type: textarea
    id: scope-and-non-goals
    attributes:
      label: "Scope and non-goals"
      description: "Define what is included and excluded."
    validations:
      required: true
  - type: textarea
    id: acceptance-criteria
    attributes:
      label: "Acceptance criteria"
      description: "List measurable completion criteria."
    validations:
      required: true
